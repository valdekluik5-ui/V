<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png?v=21"><link rel="icon" href="icon-192.png?v=21"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Suffler"><meta name="theme-color" content="#130a1b"><style>body{margin:0}[hidden]{display:none!important}</style></head><body><title>Suffler</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Symbols:wght@400&text=%E2%99%88%E2%99%89%E2%99%8A%E2%99%8B%E2%99%8C%E2%99%8D%E2%99%8E%E2%99%8F%E2%99%90%E2%99%91%E2%99%92%E2%99%93&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Old+Standard+TT:ital@0;1&family=Cormorant+SC:wght@600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: scripts library → script editor → camera with text on top → take. Night look from Quiet Moon with a zodiac wheel, single dark theme by choice. */
:root{
  --bg:#130a1b; --panel:#241532; --panel2:#331f45; --line:#523666; --mist:#8e6fb0; --fg:#f8ecf3; --muted:#c7aabd;
  --rose:#f3a6c4; --blush:#ffd9e8; --gold:#f0c97a; --ink:#130a1b; --rec:#ff8a6b;
  --f:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Cormorant Garamond",Georgia,serif; --disp:"Old Standard TT",Georgia,serif; --sc:"Cormorant SC",Georgia,serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:16px;font-variant-numeric:lining-nums}
*{box-sizing:border-box}
button,textarea,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

.app{position:relative;height:100%;max-width:520px;margin:0 auto;overflow:hidden;background:var(--bg)}
@media (min-width:600px){.app{height:min(100%,900px);border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.page{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(18px,calc(env(safe-area-inset-top,0px) + 8px)) max(16px,env(safe-area-inset-right,0px)) max(24px,calc(env(safe-area-inset-bottom,0px) + 12px)) max(16px,env(safe-area-inset-left,0px))}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.sc{font-family:var(--sc);font-weight:700;letter-spacing:.2em;color:var(--gold)}
.iconbtn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;border:1px solid var(--line);background:var(--panel);padding:0}
.iconbtn svg{width:22px;height:22px}

/* dragon look: the living dragon behind the home and editor screens, its colours on the buttons */
.dlayer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block}
.page{z-index:1}
:root[data-look=dragon]{--bg:#050304;--panel:rgba(16,9,7,.74);--panel2:rgba(28,15,11,.82);--line:rgba(255,190,140,.2);--mist:#9a8a80;--fg:#f6eee9;--muted:#cdbcb2;
  --rose:var(--acc,#ff7020);--blush:var(--hot,#ffce60);--gold:var(--hot,#ffce60);--ink:#140806}
[data-look=dragon] .app{background:#000}
[data-look=dragon] .sky{display:none}
[data-look=dragon] .card,[data-look=dragon] textarea#text,[data-look=dragon] .helper{backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
[data-look=dragon] textarea#text{background:rgba(0,0,0,.62)}
[data-look=dragon] .new,[data-look=dragon] .pill{box-shadow:0 0 18px color-mix(in srgb,var(--rose) 45%,transparent)}
[data-look=dragon] .hello h1{text-shadow:0 0 24px color-mix(in srgb,var(--gold) 35%,transparent),0 2px 10px #000}
[data-look=dragon] .words span.next{text-shadow:0 0 14px color-mix(in srgb,var(--rose) 80%,transparent)}
[data-look=dragon] .textbox::before{box-shadow:0 0 10px var(--rose)}
[data-look=dragon] .rec{border-color:var(--gold);box-shadow:0 0 16px var(--rose),inset 0 0 10px color-mix(in srgb,var(--rose) 60%,transparent)}
[data-look=dragon] .rec i{background:radial-gradient(circle at 40% 35%,var(--gold),var(--rose) 60%,#7a1606)}
[data-look=dragon] .rec.on{animation:ring 1.6s ease-in-out infinite}
@keyframes ring{50%{box-shadow:0 0 30px var(--rose),0 0 60px color-mix(in srgb,var(--rose) 40%,transparent)}}
/* after recording: the take screen shows the dragon behind it instead of the camera */
[data-look=dragon] #shoot.studio{background:transparent}
[data-look=dragon] #shoot.studio>:not(.studio){visibility:hidden}
[data-look=dragon] .studio{background:rgba(5,3,4,.35)}
#dcount{position:absolute;inset:0;width:100%;height:100%;z-index:5;display:block;pointer-events:none;background:#000;transition:opacity 1.4s ease-in}
#dcount.fade{opacity:0}
[data-look=dragon] .count{top:auto;height:40%;bottom:6%;color:var(--gold);text-shadow:0 0 30px var(--rose),0 4px 20px #000}
.looks{position:absolute;z-index:8}
.looks .sc{font-size:13px;letter-spacing:.16em}
.lookrow{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.lookrow.cols{grid-template-columns:repeat(3,1fr)}
.lookrow button{border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:10px 8px;font-weight:700;font-size:13.5px;color:var(--fg);display:flex;gap:7px;align-items:center;justify-content:center}
.lookrow button[aria-pressed=true]{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
.lookrow i{width:10px;height:10px;border-radius:50%;flex:none}

/* screen 1: scripts library */
#home{overflow-y:auto;gap:0}
.sky{position:absolute;top:0;left:0;width:100%;height:240px;pointer-events:none}
.sky text{font-family:"Noto Sans Symbols",var(--serif);font-size:11px;fill:#f0c97a;opacity:.75;text-anchor:middle;dominant-baseline:central}
.wheel{animation:turn 240s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.tw{animation:tw 3.5s ease-in-out infinite}.tw.d2{animation-delay:1.2s}.tw.d3{animation-delay:2.3s}
@keyframes tw{50%{opacity:.15}}
.zod{font-family:"Noto Sans Symbols",var(--serif)}
.season{font-family:var(--sc);font-weight:600;letter-spacing:.12em;font-size:14px;color:var(--gold);margin-top:2px}
.season .zod{letter-spacing:0;margin-right:6px}
.card .t b .zod{color:var(--gold);font-size:16px;margin-right:8px;vertical-align:2px}
.listhead h2::before,.listhead h2::after{content:'✦';font-size:9px;vertical-align:3px;margin:0 8px;opacity:.7}
.listhead h2::before{margin-left:0}
.card{position:relative}
.card::after{content:'';position:absolute;inset:4px;border:1px solid rgba(240,201,122,.12);border-radius:16px;pointer-events:none}
.hello{position:relative;display:flex;flex-direction:column;gap:6px;padding:28px 8px 0}
.hello .top{display:flex;align-items:center;gap:10px}
.hello .top .sc{font-size:13px}
.ver{font-size:12px;color:var(--muted);font-weight:600;margin-right:auto}
.hello h1{margin:0;text-shadow:0 0 24px rgba(240,201,122,.18);font-family:var(--disp);font-weight:400;font-size:34px;line-height:1.15}
.hello p{margin:0;font-family:var(--serif);font-style:italic;font-size:20px;color:var(--muted)}
.acts{position:relative;display:flex;gap:12px;padding:24px 8px 0}
.new{flex:1;min-height:56px;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--rose);color:var(--ink);border:0;border-radius:18px;font-weight:800;font-size:16px}
.new svg{width:20px;height:20px}
.quick{width:56px;height:56px;border-radius:18px}
.listhead{display:flex;justify-content:space-between;align-items:baseline;padding:28px 8px 10px}
.listhead h2{margin:0;font-size:15px;font-weight:600;letter-spacing:.14em}
.listhead span{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px;padding:0 8px 8px}
.card{display:flex;flex-direction:column;gap:8px;padding:16px 18px;background:var(--panel);border:1px solid var(--line);border-radius:20px;text-align:left;width:100%}
.card:active{background:var(--panel2)}
.card .t{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card .t b{font-family:var(--serif);font-weight:600;font-size:21px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;border:1px solid var(--mist)}
.badge.ready{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.card .p{font-size:14px;color:var(--muted);line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .m{font-size:12px;color:var(--muted)}
.empty{font-family:var(--serif);font-style:italic;font-size:19px;color:var(--muted);text-align:center;padding:30px 10px}

/* screen 2: script editor */
#write{gap:10px}
.bar{display:flex;align-items:center;gap:10px}
.bar .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
#title{width:100%;background:none;border:0;border-bottom:1px solid transparent;padding:2px 0;font-family:var(--serif);font-weight:600;font-size:22px;color:var(--fg)}
#title:focus{outline:none;border-bottom-color:var(--gold)}
#title::placeholder{color:var(--mist)}
.info{color:var(--muted);font-size:12.5px;display:flex;gap:10px}
.pill{border:0;border-radius:999px;background:var(--rose);color:var(--ink);font-weight:800;font-size:15px;padding:0 18px;height:44px;display:flex;align-items:center;gap:8px}
.pill svg{width:18px;height:18px}
.pill:disabled{opacity:.4;cursor:not-allowed}
textarea#text{flex:1;width:100%;min-height:0;resize:none;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px;font-family:var(--serif);font-size:21px;font-weight:500;line-height:1.5}
textarea#text:focus{outline:none;border-color:var(--gold)}
textarea#text::placeholder{color:var(--mist);font-style:italic}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px}
.link{background:none;border:0;padding:8px 4px;font-size:14px;font-weight:700;color:var(--muted)}
.link.warn{color:var(--rec)}
.helper{background:var(--panel);border:1px solid var(--gold);box-shadow:0 0 0 3px var(--bg),0 0 0 4px rgba(240,201,122,.25);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;max-height:42%;min-height:0}
.helper .hh{display:flex;align-items:center;gap:8px}
.helper .hh svg{width:18px;height:18px;flex:none}
.helper .hh .sc{font-size:13px;letter-spacing:.16em}
.helper .hh small{flex:1;font-size:12px;color:var(--muted)}
.helper .hh button{background:none;border:0;color:var(--muted);font-size:20px;line-height:1;padding:2px 6px}
.helper .say{margin:0;font-family:var(--serif);font-size:19px;line-height:1.4;white-space:pre-wrap;overflow-y:auto;min-height:0}
.helper .say.wait{font-style:italic;color:var(--muted)}
.helper .hb{display:flex;gap:8px}
.helper .hb button{flex:1;border-radius:14px;padding:10px;font-weight:800;font-size:14px;border:1px solid var(--line);background:var(--panel2)}
.helper .hb .use{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.kbox{display:flex;flex-direction:column;gap:8px}
.kbox .hint{white-space:pre-line}
.klink{color:var(--gold);font-weight:700;font-size:14px}
.kbox textarea{width:100%;resize:none;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:15px}
.kbox textarea:focus{outline:none;border-color:var(--gold)}
.hmore{display:flex;justify-content:space-between;margin:-4px -4px -6px}
.hmore .link{font-size:13px;padding:6px 4px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:700;color:var(--blush)}
.chips button:disabled,.askrow button:disabled{opacity:.45}
.askrow{display:flex;gap:8px;align-items:center}
.askrow input{flex:1;min-width:0;height:48px;border-radius:16px;border:1px solid var(--line);background:var(--panel);padding:0 16px;font-size:15px}
.askrow input:focus{outline:none;border-color:var(--gold)}
.askrow input::placeholder{color:var(--mist)}
.askrow button{width:48px;height:48px;flex:none;border-radius:16px;border:0;background:var(--gold);display:grid;place-items:center;padding:0}
.askrow button svg{width:20px;height:20px}

/* screen 3: camera */
#shoot{position:absolute;inset:0;background:#000}
#cam{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#cam.mirror{transform:scaleX(-1)}
.nocam{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 80%,#3a2350,#1c1026 45%,#0b0610);display:flex;align-items:flex-end;justify-content:center;padding:0 24px 150px;color:var(--muted);font-size:13px;text-align:center}
.textbox{position:absolute;left:0;right:0;top:0;height:var(--th,42%);overflow:hidden;background:rgba(19,10,27,.58);-webkit-mask:linear-gradient(#000 75%,transparent);mask:linear-gradient(#000 75%,transparent);padding-top:max(6px,env(safe-area-inset-top,0px))}
.textbox::before{content:'';position:absolute;left:50%;top:max(4px,env(safe-area-inset-top,0px));transform:translateX(-50%);width:34px;height:3px;border-radius:2px;background:var(--gold);opacity:.7}
.words{max-width:min(100%,30em);margin:0 auto;padding:0 18px 70%;font-size:var(--ts,32px);line-height:1.3;font-weight:800;color:#fff;will-change:transform;transform:translateZ(0);backface-visibility:hidden}
.words span{transition:color .5s ease}
.words span.done{color:rgba(255,255,255,.35)}
.words span.next{color:var(--gold)}
.timerwrap{position:absolute;left:0;right:0;bottom:max(158px,calc(env(safe-area-inset-bottom,0px) + 146px));z-index:3;display:flex;justify-content:center;pointer-events:none}
.glass{background:rgba(19,10,27,.6);border:1px solid rgba(255,217,232,.18);color:#fff;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.round{width:42px;height:42px;border-radius:50%;display:grid;place-items:center}
.round svg{width:20px;height:20px}
.timer{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;padding:8px 12px;border-radius:999px;display:flex;align-items:center;gap:7px}
.timer i{width:9px;height:9px;border-radius:50%;background:#777}
.meter{width:42px;height:6px;border-radius:3px;background:rgba(255,255,255,.18);overflow:hidden;display:none}.meter u{display:block;height:100%;width:0;background:var(--gold);transition:width .08s}.timer.on .meter{display:block}
.timer.on i{background:var(--rec);animation:b 1s infinite}
@keyframes b{50%{opacity:.25}}
.status{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--th,42%) + 6px);z-index:3;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.heard{position:absolute;left:16px;right:16px;bottom:max(202px,calc(env(safe-area-inset-bottom,0px) + 190px));z-index:3;text-align:center;font-size:14px;color:rgba(255,255,255,.85);text-shadow:0 1px 6px rgba(0,0,0,.8);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bottom{position:absolute;left:0;right:0;bottom:0;z-index:3;display:flex;align-items:center;justify-content:space-evenly;padding:16px 16px max(64px,calc(env(safe-area-inset-bottom,0px) + 52px));background:linear-gradient(transparent,rgba(19,10,27,.7))}
.rec{width:78px;height:78px;border-radius:50%;border:4px solid var(--blush);background:none;display:grid;place-items:center;padding:0}
.rec i{width:60px;height:60px;border-radius:50%;background:var(--rec);transition:all .2s}
.rec.on i{width:28px;height:28px;border-radius:7px}
.mode{height:42px;min-width:84px;border-radius:999px;font-size:13px;font-weight:800;padding:0 14px}
.count{position:absolute;inset:0;z-index:5;display:grid;place-items:center;font-family:var(--disp);font-size:130px;color:var(--blush);text-shadow:0 6px 40px rgba(0,0,0,.6);pointer-events:none}
.panel{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 20px max(24px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px;font-size:14.5px;font-weight:700}
.row span{flex:1}
.row input{width:50%;accent-color:var(--rose)}
.btn{border:1px solid var(--line);background:var(--panel2);border-radius:16px;padding:12px;font-weight:800}
.btn.main{background:var(--rose);color:var(--ink);border-color:var(--rose)}
.btn:disabled{opacity:.5}
/* take editor */
.studio{position:absolute;inset:0;z-index:7;background:var(--bg);display:flex;flex-direction:column;gap:10px;padding:max(14px,calc(env(safe-area-inset-top,0px) + 6px)) max(16px,env(safe-area-inset-right,0px)) max(18px,calc(env(safe-area-inset-bottom,0px) + 8px)) max(16px,env(safe-area-inset-left,0px))}
.studio .ttl{flex:1;font-family:var(--serif);font-weight:600;font-size:22px}
.stage{flex:1;min-height:120px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.frame{position:relative;overflow:hidden;border-radius:18px;background:#000;cursor:pointer;--fw:300px}
.frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tint{position:absolute;inset:0;pointer-events:none}
.cap{position:absolute;left:6%;right:6%;bottom:16%;text-align:center;pointer-events:none;font-weight:800;font-size:calc(var(--fw) * .055);line-height:1.35;color:#fff}
.cap span{background:rgba(19,10,27,.62);padding:.05em .35em;border-radius:.3em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.pp{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(19,10,27,.55);border:1px solid rgba(255,217,232,.3);display:grid;place-items:center;pointer-events:none;transition:opacity .2s}
.pp svg{width:24px;height:24px;margin-left:3px}
.frame.playing .pp{opacity:0}
.scrub{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.scrub input{flex:1;accent-color:var(--rose)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:6px}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;min-width:58px;border:0;background:none;border-radius:14px;padding:7px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted)}
.tabs button svg{width:20px;height:20px}
.tabs button.on{background:var(--panel2);color:var(--gold)}
.tool{display:flex;flex-direction:column;gap:8px;min-height:44px;justify-content:center}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button,.optbtn{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 14px;font-size:13.5px;font-weight:700;cursor:pointer;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opts .on{background:var(--rose);color:var(--ink);border-color:var(--rose)}
.row.sw input{width:auto;width:22px;height:22px}
.note{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 14px;font-size:13.5px;color:var(--blush)}
.note svg{width:18px;height:18px;flex:none}
.studio.empty .stage,.studio.empty .scrub,.studio.empty .note,.studio.empty #save,.studio.empty .edit{display:none}
@media (max-height:700px){.note{display:none}}
.edit{display:flex;flex-direction:column;gap:8px}.edit .row{font-size:13.5px}.edit .row input{width:46%}.edit output{font-size:12px;color:var(--muted);min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="app">
  <canvas id="dbg" class="dlayer" hidden aria-hidden="true"></canvas><canvas id="dfire" class="dlayer" hidden aria-hidden="true"></canvas>
  <!-- look picker: her own Suffler look, or a living dragon -->
  <div class="panel looks" id="looks" hidden>
    <div class="sc" data-t="look"></div>
    <div class="lookrow" id="lookOpts"></div>
    <div class="sc" id="lookColHead" data-t="colour"></div>
    <div class="lookrow" id="lookCols"></div>
    <p class="hint" id="lookHint" data-t="lookHint"></p>
    <button class="btn" id="looksDone" data-t="ok"></button>

/* ---------- Moon helper: Gemini straight from the phone (her own free key), ChatGPT by copy and paste ---------- */
const MOON_SYSTEM=`You help a video creator write short scripts she reads aloud to the camera from a teleprompter (Reels, TikTok, YouTube Shorts).
Write the way people talk: short sentences, warm and natural, no hashtags, no emojis, no stage directions, no headings, no quotation marks around the result.
Keep her meaning and her voice. Separate paragraphs with a blank line.
Reply with only the requested text, nothing before or after it.`;
function moonPrompt(task,text,idea,avoid){
  const L=S.ui==='uk'?'Ukrainian':'English',other=S.ui==='uk'?'English':'Ukrainian',script=`<script>\n${text}\n<\/script>`;
  const again=avoid?`\n\nGive something clearly different from this earlier suggestion:\n<earlier>\n${avoid}\n</earlier>`:'';
  return({
    hook:`${script}\n\nWrite one new opening sentence for this script that makes viewers stop scrolling in the first two seconds. It replaces the current first sentence. Write it in ${L}. Reply with that one sentence only.`,
    shorter:`${script}\n\nMake this script about 30% shorter. Keep the opening, the main points and the closing call to action. Write it in ${L}.`,
    warmer:`${script}\n\nRewrite this script in a warmer, more personal tone, like talking to a close friend. Keep the length about the same. Write it in ${L}.`,
    translate:`${script}\n\nTranslate this script into natural spoken ${other}. Keep the paragraphs.`,
    fix:`${script}\n\nFix spelling, grammar and awkward phrases in this script. Change as little as possible. Keep it in its language.`,
    write:`Write a script of about 120 to 180 words in ${L} for a short vertical video about: ${idea}\n\nStart with a strong first sentence, give two or three concrete points, end with a short friendly call to action.`+(text.trim()?`\n\nHere is her current script, to match her style:\n${script}`:'')
  })[task]+again;
}
/* newest Flash model first; the fixed name is a fallback if the alias is not offered */
const GEMINI_MODELS=['gemini-flash-latest','gemini-2.5-flash'];
async function gemini(user){
  const key=store.get('sf.gkey','');if(!key)throw new Error('nokey');
  for(const m of GEMINI_MODELS){
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:{'content-type':'application/json','x-goog-api-key':key},
      body:JSON.stringify({systemInstruction:{parts:[{text:MOON_SYSTEM}]},contents:[{role:'user',parts:[{text:user}]}]})});
    const j=await r.json().catch(()=>({}));
    if(r.ok){
      if(j.promptFeedback&&j.promptFeedback.blockReason)throw new Error('refused');
      const c=j.candidates&&j.candidates[0],parts=c&&c.content&&c.content.parts||[];
      const txt=parts.filter(p=>!p.thought).map(p=>p.text||'').join('').trim();
      if(!txt)throw new Error(c&&c.finishReason==='SAFETY'?'refused':'empty');
      return txt;
    }
    if(r.status===404)continue;
    if(r.status===429)throw new Error('busy');
    if(r.status===403||(r.status===400&&/api.?key/i.test(JSON.stringify(j))))throw new Error('badkey');
    throw new Error((j.error&&j.error.message)||String(r.status));
  }
  throw new Error('no model');
}
const clean=s=>s.trim().replace(/^["“«]([\s\S]*)["”»]$/,'$1').trim();
let H={},undoText=null;
async function moon(task,idea=''){
  const s=cur();if(!s||H.busy)return;
  const avoid=H.out&&H.task===task&&H.idea===idea&&H.sid===s.id?H.out:'';
  H={task,idea,sid:s.id,avoid,out:'',err:'',mode:'ai'};
  if(!store.get('sf.gkey','')){H.mode='key';showHelper();return}
  H.busy=true;showHelper();
  try{H.out=clean(await gemini(moonPrompt(task,s.text,idea,avoid)))}
  catch(e){const m=e instanceof TypeError?'net':e.message;
    if(m==='badkey'){H.mode='key';H.err=t('aiBadKey')}
    else H.err=m==='busy'?t('aiBusy'):m==='refused'?t('aiRefused'):m==='net'?t('aiNet'):t('aiFail')+' ('+m+')'}

}

/* ---------- voice matching ---------- */
function lev(a,b){const m=a.length,n=b.length;if(!m)return n;if(!n)return m;let p=Array.from({length:n+1},(_,i)=>i);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
function similar(a,b){if(!a||!b)return false;if(a===b)return true;if(Math.min(a.length,b.length)>=4&&a.slice(0,4)===b.slice(0,4)&&Math.abs(a.length-b.length)<=3)return true;const M=Math.max(a.length,b.length);return lev(a,b)<=(M>=7?2:M>=4?1:0)}
const SHORT=new Set(['a','an','the','i','and','to','of','in','is','it','on','for','so','but','or','my','me','you','we','at','be','do','that','this',
  'и','та','в','у','на','з','зи','що','я','це','а','не','до','за','як','то','ти','ви','ми','вин','вона','так','але','чи','же','ж','би','б','по','про','для','вже','ще','мене','мени','тебе','вас','нас','його','ии','там','тут','все','вси']);
function score(h,s){ /* how well a heard word matches a script word: 0..1 */
  if(!h||!s)return 0;if(h===s)return 1;
  const L=Math.min(h.length,s.length),M=Math.max(h.length,s.length);
  if(L>=4&&h.slice(0,4)===s.slice(0,4))return .9;          /* same stem, different ending */
  const d=lev(h,s);if(d<=(M>=8?3:M>=5?2:M>=3?1:0))return d===1?.85:.7;
  if(L>=3&&h.slice(0,3)===s.slice(0,3)&&M-L<=4)return .55;
  return 0;
}
function follow(st,spoken){ /* find where the heard phrase ends in the script, starting near st.pos */
  const heard=norm(spoken).split(' ').filter(Boolean);
  const base=st.pos,m=heard.length;if(!m)return st;
  const idx=[];for(let j=base;j<W.length&&idx.length<m*2+25;j++)if(W[j].n)idx.push(j);

    const s=sc();
    for(let i=embers.length-1;i>=0;i--){ const e=embers[i], k=(now-e.t0)/e.life;
      if(k>=1||e.y<-20){ embers.splice(i,1); continue; }
      // swirl: a slow drifting air current plus a little jitter; sparks stay straighter
      e.vx+=(Math.sin(e.y*.011+now*.0006+e.ph)*.045*e.sw+(R()-.5)*.05)*s*f*(e.spark?.3:1); e.vx*=Math.pow(.985,f); e.vy*=Math.pow(.997,f);
      e.x+=e.vx*f; e.y+=e.vy*f;
      if(e.sput>0) e.sput-=f; else if(R()<.004*f) e.sput=4+R()*10;      // sputters for a moment
      const fl=(.55+.45*Math.sin(now/e.fq+e.ph))*(e.sput>0?.25:1), a=Math.min(1,k*6)*Math.pow(1-k,.8)*fl*opt.alpha, sz=e.r*(1-k*.45)*7;
      if(e.spark){ const len=Math.min(14,Math.hypot(e.vx,e.vy)*5); x.globalAlpha=a;
        x.drawImage(spr[0],e.x-sz*.2,e.y-sz*.2,sz*.4,sz*.4); x.globalAlpha=a*.6; x.drawImage(spr[1],e.x-sz*.35,e.y-sz*.35+len*.3,sz*.7,sz*.7+len); continue; }
      x.globalAlpha=a*(1-k*.5); x.drawImage(spr[k<.5?1:2],e.x-sz/2,e.y-sz/2,sz,sz);
      x.globalAlpha=a*.75*(1-k); x.drawImage(spr[0],e.x-sz*.18,e.y-sz*.18,sz*.36,sz*.36); }
    const t=target(now); if(embers.length<t&&R()<.6) embers.push(ember(now));
    x.restore(); x.globalAlpha=1;
  }
  return {
    start(){ if(on) return; if(opt.hide) canvas.hidden=false; on=true; last=0; fit(); palKey=''; palette(performance.now()); if(reduceMotion){ on=false; return; } raf=requestAnimationFrame(frame); },
    stop(){ on=false; cancelAnimationFrame(raf); if(x) x.clearRect(0,0,W,H); if(opt.hide) canvas.hidden=true; }
  };
}

  const bg=livingDragon($('#dbg'),{maxDpr:1,fps:30,dim:.45,blinkMin:3,blinkVar:6,wakeSecs:2.5});
  const fire=fireFx($('#dfire'),'bg',{fps:30,maxDpr:1.5,flame:.8,flames:.6,rise:1,riseTall:1.5,per:12,perTall:5,bed:.2,alpha:.75,hide:true});
  const cd=livingDragon($('#dcount'),{maxDpr:1.5,fps:60,dim:0,blinkMin:3,blinkVar:6,wakeSecs:2.2});
  const LOOKS={suffler:'lookSuffler',lava:'lookLava',frost:'lookFrost',bronze:'lookBronze'};
  const COLS={own:'cOwn',cycle:'cCycle',fire:'cFire',crimson:'cCrimson',gold:'cGold',jade:'cJade',frost:'cFrost',violet:'cViolet',steel:'cSteel'};
  const rgb=a=>`rgb(${a.join(',')})`; let scr='home', tick=0, studio=false;
  const dragonOn=()=>!!LIVE_PICS[S2.look];
  function paint(){ const p=firePalette('bg'), r=document.documentElement.style; r.setProperty('--acc',rgb(p.mid)); r.setProperty('--hot',rgb(p.hot)); }
  function apply(){
    const on=dragonOn(); document.documentElement.dataset.look=on?'dragon':'suffler';
    if(on){ S.dragon.pic=S2.look; S.dragon.colour=S2.dcol||'own'; paint(); clearInterval(tick); tick=setInterval(paint,150); }
    else { clearInterval(tick); document.documentElement.style.removeProperty('--acc'); document.documentElement.style.removeProperty('--hot'); }
    const behind=on&&(scr!=='shoot'||studio);
    $('#shoot').classList.toggle('studio',studio);
    if(behind&&bg.start(S2.look,'bg')) fire.start(); else { bg.stop(); fire.stop(); }
  }
  function renderPanel(){
    $('#lookOpts').innerHTML=Object.entries(LOOKS).map(([k,n])=>`<button data-lk="${k}" aria-pressed="${(S2.look||'suffler')===k}">${esc(t(n))}</button>`).join('');
    $('#lookCols').classList.add('cols');
    $('#lookCols').innerHTML=Object.entries(COLS).map(([k,n])=>{ const c=LIVE_COLS[k]; return `<button data-dcol="${k}" aria-pressed="${(S2.dcol||'own')===k}"><i style="background:${c&&c.mid?rgb(c.mid):k==='cycle'?'conic-gradient(#ff7020,#e8282a,#a050ff,#50b4ff,#32dc6e,#f0b038,#ff7020)':'linear-gradient(90deg,#ff7020,#50b4ff)'}"></i>${esc(t(n))}</button>`; }).join('');
    const on=dragonOn(); $('#lookCols').hidden=!on; $('#lookColHead').hidden=!on; $('#lookHint').hidden=!on;
  }
  $('#lookBtn').onclick=()=>{ renderPanel(); $('#looks').hidden=false; };
  $('#looksDone').onclick=()=>{ $('#looks').hidden=true; };
  $('#looks').addEventListener('click',e=>{ const b=e.target.closest('[data-lk],[data-dcol]'); if(!b) return;
    if(b.dataset.lk) S2.look=b.dataset.lk; else S2.dcol=b.dataset.dcol; save(); apply(); renderPanel(); });
  // the take screen (after stop) opens and closes inside the camera screen
  new MutationObserver(()=>{ const open=!$('#result').hidden; if(open!==studio){ studio=open; apply(); } }).observe($('#result'),{attributes:true,attributeFilter:['hidden']});
  apply();
  return {
    screen(id){ scr=id; if(id==='shoot') $('#looks').hidden=true; apply(); },
    countStart(){ if(!dragonOn()) return false; const c=$('#dcount'); c.classList.remove('fade'); if(!cd.start(S2.look,'lock')) return false; cd.wake(); return true; },
    breathe(){ cd.breathe(true); },
    countEnd(){ const c=$('#dcount'); c.classList.add('fade'); setTimeout(()=>{ cd.breathe(false); cd.stop(); c.classList.remove('fade'); },1400); }
  };
})(S);
</script>
</body></html>
