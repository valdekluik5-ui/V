<title>Suffler Editor</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Nunito:wght@400;600;700;800;900&display=swap">
<style>
/* Layout: preview on top, transport, a scrolling timeline (clips, text and stickers, music), then tool tabs and the
   selected tool's panel. Phone first (iPhone Safari), single dark look that follows the look picked in Suffler. */
:root{
  --bg:#130a1b; --panel:#241532; --panel2:#331f45; --line:#523666; --fg:#f8ecf3; --muted:#c7aabd; --mist:#8e6fb0;
  --acc:#f3a6c4; --hot:#ffd9e8; --gold:#f0c97a; --ink:#130a1b; --warn:#ff8a6b;
  --f:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --serif:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
:root[data-look=dragon]{--bg:#070405;--panel:#160c0a;--panel2:#22130f;--line:#4a2a1f;--fg:#f6eee9;--muted:#cdbcb2;--mist:#9a8478;--acc:#ff7a2a;--hot:#ffc864;--gold:#ffc864;--ink:#140806}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f);font-size:15px;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;
  padding:max(10px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(10px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));gap:8px}
@media (min-width:600px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.top{display:flex;align-items:center;gap:10px}
.top a{color:var(--muted);text-decoration:none;font-weight:800;font-size:14px;padding:8px 4px}
.top h1{flex:1;margin:0;font-family:var(--serif);font-weight:600;font-size:22px}
.top h1 small{font-family:var(--f);font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--gold);margin-left:6px;vertical-align:3px}
.pill{border:0;border-radius:999px;background:var(--acc);color:var(--ink);font-weight:900;padding:10px 16px}
.pill:disabled{opacity:.4}
/* preview */
.stagewrap{flex:1 1 auto;min-height:150px;display:grid;place-items:center;background:#000;border-radius:16px;overflow:hidden;position:relative}
.stage{position:relative;max-width:100%;max-height:100%;aspect-ratio:9/16;height:100%;touch-action:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;color:var(--muted)}
.empty b{font-family:var(--serif);font-size:24px;color:var(--fg)}
.transport{display:flex;align-items:center;gap:10px}
.round{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;padding:0;font-size:18px}
.round.play{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.time{font-variant-numeric:tabular-nums;font-weight:800;font-size:13px;color:var(--muted);flex:1}
/* timeline */
.tl{position:relative;overflow-x:auto;overflow-y:hidden;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 0;scrollbar-width:none;touch-action:pan-x}
.tl::-webkit-scrollbar{display:none}
.tlin{position:relative;height:118px;margin:0 50%}
.row{position:absolute;left:0;height:44px}
.row.ov{top:50px;height:26px}.row.mu{top:82px;height:26px}
.blk{position:absolute;top:0;height:100%;border-radius:8px;border:2px solid transparent;overflow:hidden;background:var(--panel2) center/auto 100% repeat-x;display:flex;align-items:flex-end;padding:2px 5px;font-size:10.5px;font-weight:800;color:#fff;text-shadow:0 1px 3px #000;white-space:nowrap}
.blk.sel{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.blk .tr{position:absolute;right:-1px;top:50%;transform:translateY(-50%);width:16px;height:16px;border-radius:50%;background:var(--gold);color:var(--ink);font-size:10px;display:grid;place-items:center;z-index:2}
.bar{position:absolute;top:0;height:100%;border-radius:7px;background:color-mix(in srgb,var(--acc) 40%,var(--panel2));border:2px solid transparent;font-size:11px;font-weight:800;padding:3px 6px;overflow:hidden;white-space:nowrap;color:var(--fg)}
.bar.st{background:color-mix(in srgb,var(--gold) 35%,var(--panel2))}
.bar.music{background:color-mix(in srgb,#6fb3ff 35%,var(--panel2))}
.bar.sel{border-color:var(--gold)}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--hot);box-shadow:0 0 8px var(--acc);pointer-events:none;z-index:3}
.zoom{position:absolute;right:6px;top:6px;display:flex;gap:4px;z-index:4}
.zoom button{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:900;padding:0;font-size:14px}
/* tools */
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:0;background:none;color:var(--muted);font-weight:800;font-size:12.5px;padding:8px 10px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px}
.tabs button i{font-style:normal;font-size:18px}
.tabs button[aria-pressed=true]{background:var(--panel2);color:var(--fg)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-height:120px;max-height:34vh;overflow-y:auto}
.panel .hint{margin:0;color:var(--muted);font-size:13px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns button,.chip{border:1px solid var(--line);background:var(--panel2);border-radius:12px;padding:9px 12px;font-weight:800;font-size:13px}
.btns button.on,.chip.on{background:var(--acc);color:var(--ink);border-color:var(--acc)}
.btns button:disabled{opacity:.35}
.btns button.warn{color:var(--warn)}
label.sl{display:grid;grid-template-columns:96px 1fr 44px;align-items:center;gap:8px;font-weight:700;font-size:13px}
label.sl output{font-variant-numeric:tabular-nums;color:var(--muted);text-align:right;font-size:12px}
input[type=range]{width:100%;accent-color:var(--acc)}
input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.grid button{aspect-ratio:1;border:1px solid var(--line);background:var(--panel2);border-radius:10px;font-size:22px;padding:0}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button.on{border-color:var(--fg);box-shadow:0 0 0 2px var(--acc)}
.sub{font-size:11px;font-weight:900;letter-spacing:.14em;color:var(--gold);text-transform:uppercase}
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.72);display:grid;place-items:center;padding:20px}
.modal .box{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal h2{margin:0;font-family:var(--serif);font-size:24px}
.prog{height:8px;border-radius:4px;background:var(--panel2);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--acc);transition:width .2s}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;cursor:pointer}
</style></head><body>
<div class="app">
  <div class="top"><a href="./" id="back">‹ Suffler</a><h1 data-t="title"></h1><button class="pill" id="exportBtn" data-t="save" disabled></button></div>

  <div class="stagewrap" id="stagewrap">
    <div class="stage" id="stage"><canvas id="gl"></canvas><canvas id="ov"></canvas></div>
    <div class="empty" id="empty"><b data-t="emptyT"></b><span data-t="emptyD"></span>
      <label class="pill file"><span data-t="addVideos"></span><input type="file" accept="video/*" multiple id="pick0"></label></div>
  </div>

  <div class="transport">
    <button class="round play" id="playBtn" aria-label="Play">▶</button>
    <span class="time" id="time">0:00.0 / 0:00.0</span>
    <button class="round" id="undoBtn" aria-label="Undo" title="Undo" disabled>↶</button>
  </div>

  <div class="tl" id="tl"><div class="zoom"><button id="zOut" aria-label="Zoom out">−</button><button id="zIn" aria-label="Zoom in">+</button></div>
    <div class="tlin" id="tlin"><div class="row" id="rowClips"></div><div class="row ov" id="rowOv"></div><div class="row mu" id="rowMu"></div><div class="ph" id="ph"></div></div></div>

  <div class="tabs" id="tabs">
    <button data-tab="add"><i>＋</i><span data-t="tAdd"></span></button>
    <button data-tab="edit"><i>✂</i><span data-t="tEdit"></span></button>
    <button data-tab="speed"><i>⏩</i><span data-t="tSpeed"></span></button>
    <button data-tab="look"><i>✦</i><span data-t="tLook"></span></button>
    <button data-tab="trans"><i>⧉</i><span data-t="tTrans"></span></button>
    <button data-tab="text"><i>T</i><span data-t="tText"></span></button>
    <button data-tab="sticker"><i>☺</i><span data-t="tSticker"></span></button>
    <button data-tab="music"><i>♪</i><span data-t="tMusic"></span></button>
    <button data-tab="format"><i>▭</i><span data-t="tFormat"></span></button>
  </div>
  <div class="panel" id="panel"></div>
</div>

<div class="modal" id="exportModal" hidden><div class="box">
  <h2 data-t="saveT"></h2>
  <div class="btns" id="resBtns"><button data-res="720" class="on">720p</button><button data-res="1080">1080p</button></div>
  <p class="hint" id="exportHint" data-t="saveHint"></p>
  <div class="prog" id="prog" hidden><i></i></div>
  <div class="btns"><button class="pill" id="exportGo" data-t="saveGo"></button><button id="exportClose" data-t="close"></button></div>
</div></div>

<script>
/* ---------- words ---------- */
const T={

  pickClip:'Спершу торкнись кліпу на таймлайні.',split:'Розрізати тут',del:'Видалити',dup:'Дублювати',left:'Ліворуч',right:'Праворуч',trimS:'Початок',trimE:'Кінець',vol:'Гучність',

};
let SF={}; try{ SF=JSON.parse(localStorage.getItem('sf.settings')||'{}'); }catch(e){}
const L=T[SF.ui]?SF.ui:'en', t=k=>T[L][k];
if(['lava','frost','bronze'].includes(SF.look)) document.documentElement.dataset.look='dragon';
document.documentElement.lang=L;
document.querySelectorAll('[data-t]').forEach(e=>e.textContent=t(e.dataset.t));
const $=q=>document.querySelector(q), esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{ s=Math.max(0,s); const m=Math.floor(s/60), r=s-m*60; return m+':'+(r<10?'0':'')+r.toFixed(1); };
const uid=()=>Math.random().toString(36).slice(2,9);

/* ---------- project ---------- */
const P={clips:[],items:[],music:null,aspect:'916'};
const ASPECTS={'916':[9,16],'11':[1,1],'45':[4,5],'169':[16,9]};
const FILTERS={none:[0,1,1,0,0],warm:[.02,1.04,1.08,.35,0],cool:[0,1.04,.95,-.35,0],vivid:[.02,1.15,1.4,.05,0],film:[-.02,1.1,.85,.15,.25],fade:[.08,.82,.75,.05,.15],mono:[0,1.08,0,0,0],noir:[-.06,1.45,0,0,.2]};
let sel=null;        // {kind:'clip'|'item'|'music', id}
let tab='add', T0=0, now0=0, playing=false, Tcur=0, total=0, scale=60, exporting=null;
const undoStack=[];
function snapshot(){ undoStack.push(JSON.stringify({clips:P.clips.map(c=>({...c,el:undefined,src:undefined,gain:undefined})),items:P.items,aspect:P.aspect})); if(undoStack.length>40) undoStack.shift(); $('#undoBtn').disabled=false; }
function undo(){ const s=undoStack.pop(); if(!s) return; const d=JSON.parse(s), byId=Object.fromEntries(P.clips.map(c=>[c.id,c]));
  P.clips=d.clips.map(c=>({...c,el:(byId[c.id]||mediaFor(c)).el,gain:(byId[c.id]||{}).gain})); P.items=d.items; P.aspect=d.aspect; sel=null; $('#undoBtn').disabled=!undoStack.length; refresh(); }
const media={};   // one video element per picked file, shared by clips cut from it
function mediaFor(c){ return media[c.mid]; }
function layout(){ let t=0; for(const c of P.clips){ c.t0=t; c.len=Math.max(.05,(c.outS-c.inS)/c.speed); t+=c.len; } total=t; }
function clipAt(T){ for(let i=0;i<P.clips.length;i++){ const c=P.clips[i]; if(T<c.t0+c.len-1e-4||i===P.clips.length-1) return i; } return -1; }
const selClip=()=>sel&&sel.kind==='clip'?P.clips.find(c=>c.id===sel.id):null;
const selItem=()=>sel&&sel.kind==='item'?P.items.find(i=>i.id===sel.id):null;

/* ---------- sound: every video and the music go through one mix (needed for volume on iPhone and for saving) ---------- */
let AC=null, master=null;
function ensureAC(){ if(AC){ if(AC.state==='suspended') AC.resume(); return; } try{ AC=new (window.AudioContext||window.webkitAudioContext)(); master=AC.createGain(); master.connect(AC.destination);
  for(const m of Object.values(media)) hookAudio(m); if(P.music) hookAudio(P.music); }catch(e){ AC=null; } }
function hookAudio(m){ if(!AC||m.gain) return; try{ const s=AC.createMediaElementSource(m.el); m.gain=AC.createGain(); m.gain.gain.value=0; s.connect(m.gain); m.gain.connect(master); }catch(e){} }

/* ---------- adding videos ---------- */
async function addFiles(files){
  const list=[...files].filter(f=>f.type.startsWith('video/')||/\.(mp4|mov|webm|m4v)$/i.test(f.name)); if(!list.length) return;
  ensureAC(); snapshot();
  for(const f of list){
    const mid=uid(), el=document.createElement('video'); el.playsInline=true; el.setAttribute('playsinline',''); el.preload='auto'; el.src=URL.createObjectURL(f); el.crossOrigin='anonymous';
    media[mid]={el,name:f.name,gain:null}; hookAudio(media[mid]);
    await new Promise(r=>{ el.onloadedmetadata=()=>r(); el.onerror=()=>r(); setTimeout(r,8000); });
    const dur=isFinite(el.duration)&&el.duration>0?el.duration:await realDuration(el);
    const c={id:uid(),mid,inS:0,outS:dur,dur,speed:1,vol:1,filter:'none',adj:{b:0,c:1,s:1,w:0},zoom:1,trans:'none',name:f.name.replace(/\.[^.]+$/,'')};

  }
  if(!sel) sel={kind:'clip',id:P.clips[0].id};
  refresh(); seek(Tcur);
}
/* some recordings report no length until read to the end */
function realDuration(el){ return new Promise(r=>{ const done=()=>{ el.ontimeupdate=null; const d=el.duration; el.currentTime=0; r(isFinite(d)?d:1); }; el.ontimeupdate=done; el.currentTime=1e7; setTimeout(done,4000); }); }
function thumb(m){ const el=m.el, go=()=>{ try{ const c=document.createElement('canvas'), h=88, w=Math.round(h*(el.videoWidth||9)/(el.videoHeight||16)); c.width=w; c.height=h; c.getContext('2d').drawImage(el,0,0,w,h); m.thumb=c.toDataURL('image/jpeg',.6); renderTimeline(); }catch(e){} };
  if(el.readyState>=2) go(); else el.addEventListener('loadeddata',go,{once:true}); }
$('#pick0').onchange=e=>{ addFiles(e.target.files); e.target.value=''; };

/* ---------- drawing: WebGL for the picture (filters, zoom, transitions), a 2D layer for text and stickers ---------- */
const gl=$('#gl').getContext('webgl',{preserveDrawingBuffer:true,premultipliedAlpha:false}), ov=$('#ov'), ox=ov.getContext('2d');
const VS='attribute vec2 a; varying vec2 uv; void main(){ uv=vec2(a.x*.5+.5,.5-a.y*.5); gl_Position=vec4(a,0.,1.); }';
const FS=`precision mediump float; varying vec2 uv; uniform sampler2D cur,prev; uniform vec4 cropC,cropP; uniform vec4 adj; uniform float grain,mode,p,hasPrev,t;
vec3 look(vec3 c){ c+=adj.x; c=(c-.5)*adj.y+.5; float l=dot(c,vec3(.299,.587,.114)); c=mix(vec3(l),c,adj.z); c.r+=adj.w*.12; c.b-=adj.w*.12; return c; }
vec3 samp(sampler2D s, vec4 cr, vec2 u){ vec2 q=cr.xy+u*cr.zw; if(q.x<0.||q.y<0.||q.x>1.||q.y>1.) return vec3(0.); return texture2D(s,q).rgb; }

$('#panel').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return; const c=selClip(), it=selItem(), d=b.dataset;
  if(d.act==='split'&&c){ const at=c.inS+(Tcur-c.t0)*c.speed; if(at<=c.inS+.05||at>=c.outS-.05) return; snapshot(); const i=P.clips.indexOf(c), n={...c,id:uid(),adj:{...c.adj},inS:at}; c.outS=at; c.trans='none'; P.clips.splice(i+1,0,n); sel={kind:'clip',id:n.id}; }
  else if(d.act==='dup'&&c){ snapshot(); const i=P.clips.indexOf(c), n={...c,id:uid(),adj:{...c.adj}}; P.clips.splice(i+1,0,n); sel={kind:'clip',id:n.id}; }
  else if(d.act==='del'&&c){ snapshot(); P.clips.splice(P.clips.indexOf(c),1); sel=null; }
  else if((d.act==='left'||d.act==='right')&&c){ const i=P.clips.indexOf(c), j=i+(d.act==='left'?-1:1); if(j<0||j>=P.clips.length) return; snapshot(); [P.clips[i],P.clips[j]]=[P.clips[j],P.clips[i]]; }
  else if(d.speed&&c){ snapshot(); c.speed=+d.speed; }
  else if(d.filter&&c){ snapshot(); c.filter=d.filter; }
  else if(d.act==='resetLook'&&c){ snapshot(); c.filter='none'; c.adj={b:0,c:1,s:1,w:0}; c.zoom=1; }
  else if(d.trans&&c){ snapshot(); c.trans=d.trans; if(d.trans!=='none'){ seek(Math.max(0,c.t0+c.len-.6)); if(!playing) play(); } }
  else if(d.act==='addText'){ snapshot(); const n={id:uid(),type:'text',text:t('textPh'),style:'box',color:'#ffffff',size:.07,anim:'pop',x:.5,y:.3,start:Tcur,end:Math.min(Math.max(total,Tcur+3),Tcur+3)}; P.items.push(n); sel={kind:'item',id:n.id}; refresh(); setTimeout(()=>{ const i=$('#txt'); if(i){ i.focus(); i.select(); } },50); return; }
  else if(d.sticker){ snapshot(); const n={id:uid(),type:'sticker',text:d.sticker,style:'clean',color:'#fff',size:.09,anim:'pop',x:.5,y:.5,start:Tcur,end:Math.min(Math.max(total,Tcur+3),Tcur+3)}; P.items.push(n); sel={kind:'item',id:n.id}; }
  else if(d.style&&it){ snapshot(); it.style=d.style; }
  else if(d.color&&it){ snapshot(); it.color=d.color; }
  else if(d.anim&&it){ snapshot(); it.anim=d.anim; }
  else if(d.act==='delItem'&&it){ snapshot(); P.items.splice(P.items.indexOf(it),1); sel=null; }
  else if(d.act==='delMusic'){ if(P.music){ P.music.el.pause(); P.music=null; } sel=null; }
  else if(d.aspect){ snapshot(); P.aspect=d.aspect; sizeCanvases(); }
  else return;
  refresh();
});
let slideSnap=false;
$('#panel').addEventListener('pointerdown',e=>{ if(e.target.type==='range'&&!slideSnap){ snapshot(); slideSnap=true; } });
$('#panel').addEventListener('pointerup',()=>{ slideSnap=false; });
$('#panel').addEventListener('input',e=>{
  const el=e.target, v=+el.value, c=selClip(), it=selItem(), o=$('#'+el.id+'O');
  if(el.id==='txt'&&it){ it.text=el.value; renderTimeline(); return; }
  if(c){ if(el.id==='trS'){ c.inS=Math.min(v,c.outS-.1); o.textContent=fmt(c.inS); seek(c.t0); }
    if(el.id==='trE'){ c.outS=Math.max(v,c.inS+.1); o.textContent=fmt(c.outS); layout(); seek(c.t0+c.len-.05); }
    if(el.id==='cvol'){ c.vol=v; o.textContent=Math.round(v*100)+'%'; }
    if(el.id==='ab'){ c.adj.b=v; o.textContent=Math.round(v*100); } if(el.id==='ac'){ c.adj.c=v; o.textContent=Math.round(v*100)+'%'; }
    if(el.id==='as'){ c.adj.s=v; o.textContent=Math.round(v*100)+'%'; } if(el.id==='aw'){ c.adj.w=v; o.textContent=Math.round(v*100); }
    if(el.id==='az'){ c.zoom=v; o.textContent=v.toFixed(2)+'×'; } }
  if(it){ if(el.id==='isz'){ it.size=v; o.textContent=Math.round(v*100); }
    if(el.id==='ist'){ it.start=Math.min(v,it.end-.2); o.textContent=fmt(it.start); seek(it.start); }
    if(el.id==='ien'){ it.end=Math.max(v,it.start+.2); o.textContent=fmt(it.end); seek(it.end-.05); } }
  if(P.music&&el.id==='mvol'){ P.music.vol=v; o.textContent=Math.round(v*100)+'%'; }
  if(P.music&&el.id==='mduck'){ P.music.duck=el.checked; }
  renderTimeline();
});
$('#panel').addEventListener('change',e=>{
  if(e.target.id==='pick1'){ addFiles(e.target.files); e.target.value=''; }
  if(e.target.id==='pickM'&&e.target.files[0]){ const f=e.target.files[0]; ensureAC(); if(P.music) P.music.el.pause();
    const el=new Audio(); el.src=URL.createObjectURL(f); el.preload='auto'; el.crossOrigin='anonymous';
    P.music={el,name:f.name.replace(/\.[^.]+$/,''),vol:.8,duck:true,at:0,dur:30,gain:null}; hookAudio(P.music);
    el.onloadedmetadata=()=>{ P.music.dur=isFinite(el.duration)?el.duration:30; refresh(); }; e.target.value=''; sel={kind:'music'}; refresh(); }
  if(e.target.id==='mduck'&&P.music) P.music.duck=e.target.checked;
});

/* ---------- saving: the timeline plays through once into a recorder ---------- */
let res=720;
$('#exportBtn').onclick=()=>{ pause(); $('#exportModal').hidden=false; $('#prog').hidden=true; $('#exportHint').textContent=t('saveHint'); $('#exportGo').disabled=false; };
$('#exportClose').onclick=()=>{ if(exporting) exporting.cancel(); $('#exportModal').hidden=true; };
$('#resBtns').addEventListener('click',e=>{ const b=e.target.closest('[data-res]'); if(!b) return; res=+b.dataset.res; $('#resBtns').querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); });
function pickMime(){ if(!window.MediaRecorder) return null; for(const m of ['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']) if(MediaRecorder.isTypeSupported(m)) return m; return ''; }
$('#exportGo').onclick=async()=>{
  const mime=pickMime(), out=document.createElement('canvas');
  if(mime===null||!out.captureStream){ $('#exportHint').textContent=t('saveFail'); return; }
  ensureAC(); sizeCanvases(res); out.width=gl.canvas.width; out.height=gl.canvas.height; const cx=out.getContext('2d');
  const dest=AC.createMediaStreamDestination(); master.connect(dest);
  const stream=new MediaStream([...out.captureStream(30).getVideoTracks(),...dest.stream.getAudioTracks()]);
  let rec; try{ rec=new MediaRecorder(stream,Object.assign({videoBitsPerSecond:res>=1080?10000000:6000000,audioBitsPerSecond:160000},mime?{mimeType:mime}:{})); }catch(err){ $('#exportHint').textContent=t('saveFail'); return; }
  const parts=[]; rec.ondataavailable=ev=>{ if(ev.data.size) parts.push(ev.data); };
  $('#exportGo').disabled=true; $('#prog').hidden=false; const bar=$('#prog i');
  const sel0=sel; sel=null;
  const done=ok=>{ exporting=null; sel=sel0; try{ master.disconnect(dest); }catch(e){} sizeCanvases(); if(!ok){ $('#exportGo').disabled=false; return; }
    const blob=new Blob(parts,{type:rec.mimeType||mime||'video/mp4'}), ext=(blob.type||'').includes('mp4')?'mp4':'webm', u=URL.createObjectURL(blob), a=document.createElement('a');
    a.href=u; a.download='suffler-'+new Date().toISOString().slice(0,16).replace(/[:T]/g,'-')+'.'+ext; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000);
    $('#exportHint').textContent=t('saved'); $('#exportGo').disabled=false; };
  exporting={
    draw(){ cx.drawImage(gl.canvas,0,0); cx.drawImage(ov,0,0); bar.style.width=Math.round(Tcur/Math.max(.01,total)*100)+'%'; $('#exportHint').textContent=t('saving')+Math.round(Tcur/Math.max(.01,total)*100)+'%'; },
    finish(){ setTimeout(()=>{ try{ rec.stop(); }catch(e){} },150); },
    cancel(){ pause(); rec.onstop=null; try{ rec.stop(); }catch(e){} done(false); }
  };
  rec.onstop=()=>done(true);
  Tcur=0; curIdx=-1; await new Promise(r=>setTimeout(r,300)); rec.start(500); play();
};

addEventListener('beforeunload',e=>{ if(P.clips.length){ e.preventDefault(); e.returnValue=t('leave'); } });
sizeCanvases(); refresh();
</script>
